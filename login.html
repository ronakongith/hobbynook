
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login & Register | Hobby Nook</title>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fffef5;
            color: #384b54;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 7%;
            box-shadow: 0 2px 12px #384b5410;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 23px;
            font-weight: 600;
            color: #384b54;
            text-decoration: none;
        }

        .logo small {
            display: block;
            font-family: 'Caveat', cursive;
            font-size: 16px;
            color: #82a789;
            font-weight: 500;
        }

        .home {
            text-decoration: none;
            color: #384b54;
            font-size: 14px;
        }

        .container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
        }

        .auth-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 35px #384b5412;
            border: 1px solid #edf0e7;
        }

        .hand {
            font-family: 'Caveat', cursive;
            color: #82a789;
            font-size: 23px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 29px;
            text-align: center;
            margin: 8px 0;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #7a8586;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            background: #f3f5ed;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .tabs button {
            width: 50%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #384b54;
            font-family: inherit;
            cursor: pointer;
        }

        .tabs button.active {
            background: #dcebdc;
            font-weight: 600;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe5dc;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            background: #fff;
        }

        input:focus {
            border-color: #82a789;
            box-shadow: 0 0 0 3px #82a78920;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #384b54;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #526c63;
        }

        .message {
            font-size: 13px;
            text-align: center;
            margin: 14px 0 0;
            line-height: 1.5;
        }

        .switch-text {
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            color: #6c7777;
        }

        .switch-text a {
            color: #668c6d;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #7a8586;
            font-family: 'Caveat', cursive;
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            Hobby Nook
            <small>Learn · Create · Connect</small>
        </a>

        <a href="index.html" class="home">← Back to Home</a>
    </nav>
</header>

<main class="container">
    <div class="auth-box">

        <div class="hand">A little space for your big ideas ♡</div>
        <h1 id="heading">Welcome Back!</h1>
        <p class="subtitle" id="subtitle">
            Log in and continue your creative journey.
        </p>

        <div class="tabs">
            <button type="button" id="loginTab"
                    class="active" onclick="showLogin()">
                Login
            </button>

            <button type="button" id="registerTab"
                    onclick="showRegister()">
                Register
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" novalidate>

            <div class="field">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">
                Login to Hobby Nook →
            </button>

            <p class="switch-text">
                New here?
                <a onclick="showRegister()">Create an account</a>
            </p>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" class="hidden" novalidate>

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="field">
                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="registerPassword">Create Password</label>
                <input type="password" id="registerPassword"
                       placeholder="At least 8 characters"
                       minlength="8" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Enter password again" required>
            </div>

            <button type="submit" class="submit-btn">
                Create My Account →
            </button>

            <p class="switch-text">
                Already a member?
                <a onclick="showLogin()">Login here</a>
            </p>
        </form>

        <p id="message" class="message" role="status"
           aria-live="polite"></p>

    </div>
</main>

<footer>
    Create · Learn · Celebrate ♡
</footer>

<script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const message = document.getElementById("message");

    function showLogin() {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        heading.textContent = "Welcome Back!";
        subtitle.textContent =
            "Log in and continue your creative journey.";

        message.textContent = "";
    }

    function showRegister() {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        heading.textContent = "Join Our Community!";
        subtitle.textContent =
            "Create an account and discover your next hobby.";

        message.textContent = "";
    }

    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
            showMessage("Please fill in all fields.", false);
        } else if (!loginForm.checkValidity()) {
            showMessage("Please enter a valid email address.", false);
        } else {
            showMessage(
                "Form validated! Connect PHP to verify your login.",
                true
            );
        }
    });

    registerForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const password = document.getElementById("registerPassword").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (!name || !email || !password || !confirm) {
            showMessage("Please fill in all fields.", false);
        } else if (!registerForm.checkValidity()) {
            showMessage(
                "Enter a valid email and a password of at least 8 characters.",
                false
            );
        } else if (password !== confirm) {
            showMessage("Passwords do not match!", false);
        } else {
            showMessage(
                "Form validated! Connect PHP to create your account.",
                true
            );
        }
    });

    function showMessage(text, success) {
        message.textContent = text;
        message.style.color = success ? "#527c58" : "#c0392b";
    }
</script>

</body>
</html>
